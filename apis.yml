name: Linkett
description: Linkett is a digital out-of-home (DOOH) analytics platform for digital signage and retail
  displays. A proprietary WiFi sensor mounted at the screen passively gathers audience data from nearby
  smartphones with no app required, and a hosted dashboard reports real-time campaign performance metrics
  such as impressions, dwell time, frequency and conversion rate, alongside demographic and behavioural
  insight, giving advertising agencies detailed client reporting and giving advertisers measurement they
  can tie back to return on ad spend. Linkett is a WestonExpressions Inc. company with offices in Toronto,
  Ontario and Mountain View, California, says it is used by 100+ digital out-of-home networks, and was
  surfaced through the 500 Global portfolio. It sells self-serve at $25 and $50 per month plus a one-time
  $130 hardware fee, with custom integrations offered only on a contact-sales enterprise tier. As of this
  enrichment pass Linkett publishes no public developer portal, API reference, SDK, or machine-readable
  API specification on any host it controls, and its marketing site is served behind a bot/CAPTCHA
  challenge that blocks automated retrieval of every path.
