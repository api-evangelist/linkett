name: Linkett
description: Linkett is a digital out-of-home (DOOH) analytics platform for digital signage and retail
  displays. Its proprietary technology passively gathers audience data at the screen and reports real-time
  campaign performance metrics such as impressions, dwell time, and engagement, giving advertising agencies
  detailed client reporting and giving advertisers measurement they can tie back to return on ad spend.
  Linkett is headquartered in Canada with offices in Toronto and California, and was surfaced through the
  500 Global portfolio. As of this enrichment pass Linkett publishes no public developer portal, API
  reference, or machine-readable API specification, and its website is served behind a bot/CAPTCHA
  challenge that blocks automated retrieval.
